name: Publish FlowMLLab v1.11.0

on:
  push:
    tags: [v1.11.0]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-flowmllab-v1.11.0

jobs:
  release:
    if: github.repository == 'Ehsan-Roohi/FlowMLLab' && github.ref == 'refs/tags/v1.11.0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Check the course and build the Python distributions
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install -e '.[test]' build twine
          python qa/update_course_inventory.py
          python qa/validate_course_release.py
          python -m pytest -q qa/test_release_integrity.py tests/test_course_navigation.py
          python -m build
          python -m twine check dist/*
      - name: Verify the isolated wheel
        run: |
          python -m venv /tmp/flowmllab-release
          /tmp/flowmllab-release/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/flowmllab-release/bin/python -c 'from importlib.metadata import version; import flowmllab; assert version("flowmllab") == flowmllab.__version__ == "1.11.0"'
          /tmp/flowmllab-release/bin/flowmllab smoke
      - name: Publish the reviewed tag
        run: |
          sha256sum dist/* lectures/week01_3_keras_optimizers.pdf notebooks/week01_3/W1_3_Keras_Optimizers.ipynb > release_assets_v1.11.0_sha256.txt
          gh release create v1.11.0 --verify-tag --latest \
            --title 'FlowMLLab v1.11.0 - Optimizers for scientific machine learning' \
            --notes-file RELEASE_NOTES_v1.11.0.md \
            dist/* lectures/week01_3_keras_optimizers.pdf notebooks/week01_3/W1_3_Keras_Optimizers.ipynb release_assets_v1.11.0_sha256.txt
