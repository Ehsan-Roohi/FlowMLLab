name: Build Week 16 educational lecture

on:
  push:
    branches: [main]
    paths:
      - 'lectures/source/week16_supersonic_shape_optimization.tex'
      - 'lectures/source/week16_parts/**'
      - 'lectures/source/week16_tex_assets/**'
      - 'results/late_course_teaching/week16*.png'
      - 'results/week16_lowboom/reference/*.png'
      - 'qa/week16/build_week16_lecture.py'
      - 'qa/lecture_typography.py'
      - '.github/workflows/week16-lecture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install LaTeX and font utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-latex-extra texlive-fonts-recommended fonts-stix poppler-utils fontconfig cabextract curl
      - name: Install plotting/PDF dependencies
        run: python -m pip install 'numpy>=2.0,<2.3' 'matplotlib>=3.8,<3.11' 'pypdf>=3,<7'
      - name: Install the recorded Times New Roman build fonts
        run: |
          font_installer="$RUNNER_TEMP/flowmllab-times32.exe"
          font_dir="$HOME/.local/share/fonts/msttcorefonts"
          curl --fail --location --retry 3 --output "$font_installer" \
            https://downloads.sourceforge.net/corefonts/times32.exe
          printf '%s  %s\n' 'db56595ec6ef5d3de5c24994f001f03b2a13e37cee27bc25c58f6f43e8f807ab' "$font_installer" | sha256sum --check -
          mkdir -p "$font_dir"
          cabextract -q -d "$font_dir" "$font_installer"
          fc-cache -f "$font_dir"
          python qa/lecture_typography.py
      - name: Compile the lecture using the reviewed figures
        run: python qa/week16/build_week16_lecture.py --output-dir "$RUNNER_TEMP/week16-lecture"
      - name: Check the isolated PDF and preserve published assets
        run: |
          pdfinfo "$RUNNER_TEMP/week16-lecture/week16_supersonic_shape_optimization.pdf" | grep Pages
          pdffonts "$RUNNER_TEMP/week16-lecture/week16_supersonic_shape_optimization.pdf" | head -20
          git diff --exit-code -- lectures/week16_supersonic_shape_optimization.pdf lectures/source/week16_tex_assets
      - uses: actions/upload-artifact@v4
        with:
          name: week16-educational-lecture
          path: ${{ runner.temp }}/week16-lecture/week16_supersonic_shape_optimization.pdf
          retention-days: 14
