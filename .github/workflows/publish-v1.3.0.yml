name: Publish FlowMLLab v1.3.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - RELEASE_NOTES_v1.3.0.md

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'Ehsan-Roohi/FlowMLLab'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4

      - name: Publish the versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.3.0 >/dev/null 2>&1; then
            echo "Release v1.3.0 already exists."
          else
            gh release create v1.3.0 \
              --target "${GITHUB_SHA}" \
              --title "FlowMLLab v1.3.0 — DSMC reproduction and improved nozzle" \
              --notes-file RELEASE_NOTES_v1.3.0.md \
              lectures/week10_dsmc_data_driven_surrogates.pdf \
              notebooks/week10/W10_DSMC_Data_Driven_Surrogates_Student.ipynb \
              results/aescte_dsmc/week10_validation_metrics.csv \
              results/aescte_dsmc/week10_dsmc_reproduction_summary.png
          fi
