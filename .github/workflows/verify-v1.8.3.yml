name: Verify Week 15 retained evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .gitattributes
      - notebooks/week15/W15_Complete_Geometry_Generalization.ipynb
      - results/week15_postaudit/**
      - lectures/week15_geometry_generalization.pdf
      - qa/test_release_integrity.py
      - pyproject.toml
      - .github/workflows/verify-v1.8.3.yml

permissions:
  contents: read

jobs:
  fresh-clone-release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install PDF validation tools
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Install verified runtime
        run: python -m pip install -e '.[test]'
      - name: Download and verify frozen Week 15 evidence
        run: |
          curl -L --fail --retry 3 \
            -o ../FlowMLLab_Week15_PostAudit_LR_Sweep.zip \
            https://zenodo.org/api/records/22840293/files/FlowMLLab_Week15_PostAudit_LR_Sweep.zip/content
          echo 'e9f6e1c05bec59be4cee759f721bc8ccbc78119d22a00a31304932103f0ca9d9  ../FlowMLLab_Week15_PostAudit_LR_Sweep.zip' | sha256sum --check
          unzip -q ../FlowMLLab_Week15_PostAudit_LR_Sweep.zip -d ..
      - name: Execute flagship notebook with a real Jupyter kernel
        env:
          FLOWMLLAB_WEEK15_LR_DIR: ${{ github.workspace }}/../FlowMLLab_Week15_PostAudit_LR_Sweep
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient
          path = Path('notebooks/week15/W15_Complete_Geometry_Generalization.ipynb')
          notebook = nbformat.read(path, as_version=4)
          nbformat.validate(notebook)
          published_cells = [
              cell for cell in notebook.cells
              if cell.cell_type == 'code' and cell.source.strip()
          ]
          assert published_cells, 'The current notebook has no executable cells'
          for cell in published_cells:
              cell.outputs = []
              cell.execution_count = None
          # Require the downloaded, hash-verified archive rather than the notebook's preview fallback.
          evidence_check = nbformat.v4.new_code_cell(
              "assert FULL_EVIDENCE_AVAILABLE, 'The frozen Week 15 evidence was not loaded'"
          )
          notebook.cells.append(evidence_check)
          NotebookClient(
              notebook,
              timeout=600,
              kernel_name='python3',
              resources={'metadata': {'path': str(path.parent)}},
          ).execute()
          errors = [
              output
              for cell in notebook.cells if cell.cell_type == 'code'
              for output in cell.get('outputs', []) if output.output_type == 'error'
          ]
          assert not errors
          executed_cells = published_cells + [evidence_check]
          assert [cell.execution_count for cell in executed_cells] == list(
              range(1, len(executed_cells) + 1)
          ), 'Every current notebook cell and the evidence check must execute'
          print(f'WEEK15_REAL_KERNEL_PASS: {len(published_cells)} published code cells + frozen-evidence check')
          PY
      - name: Run release gates
        run: |
          python -m pytest -q tests qa
          flowmllab qa --root .
          python qa/validate_course_release.py
      - name: Require a clean tracked checkout
        run: git diff --exit-code
