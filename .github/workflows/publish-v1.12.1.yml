name: Publish FlowMLLab v1.12.1

on:
  push:
    tags: [v1.12.1]
    branches: [codex/cavity-visible-validation]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-flowmllab-v1.12.1

jobs:
  release:
    if: github.repository == 'Ehsan-Roohi/FlowMLLab' && (github.ref == 'refs/tags/v1.12.1' || github.ref == 'refs/heads/codex/cavity-visible-validation')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Check the course and build the Python distributions
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install -e '.[test]' build twine
          python qa/update_course_inventory.py
          python qa/validate_course_release.py
          python qa/validate_cavity_expansion.py
          python qa/check_cavity_notebooks.py
          python -m pytest -q qa/test_release_integrity.py tests/test_course_navigation.py tests/test_ghia_allre.py tests/test_cavity_validation.py tests/test_deep_cavity_audit.py tests/test_pressure_velocity_experiments.py
          python -m build
          python -m twine check dist/*
      - name: Verify the isolated wheel
        run: |
          python -m venv /tmp/flowmllab-release
          /tmp/flowmllab-release/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/flowmllab-release/bin/python -c 'from importlib.metadata import version; import flowmllab; assert version("flowmllab") == flowmllab.__version__ == "1.12.1"'
          /tmp/flowmllab-release/bin/flowmllab smoke
      - name: Publish the reviewed tag
        if: github.ref == 'refs/tags/v1.12.1'
        run: |
          sha256sum dist/* results/cavity_cfd_ghia/cfd_ghia_validation.png results/cavity_cfd_ghia/cfd_ghia_metrics.csv output/qa/cavity_notebook_execution.json lectures/week01_numerical_foundations.pdf lectures/week01_2_pressure_velocity.pdf lectures/week04_cavity_surrogates_deeponet.pdf lectures/week13_rectangular_cavity_pinn.pdf notebooks/week04/W4_Lab5_All_Re_Ghia_Validation.ipynb notebooks/week04/W4_Lab6_Ghia_Profile_Optimizer_Depth.ipynb notebooks/week13/W13_Deep_Cavity_D5_Regional_Accuracy.ipynb > release_assets_v1.12.1_sha256.txt
          gh release create v1.12.1 --verify-tag --latest \
            --title 'FlowMLLab v1.12.1 - Show our CFD validation and neural predictions' \
            --notes-file RELEASE_NOTES_v1.12.1.md \
            dist/* results/cavity_cfd_ghia/cfd_ghia_validation.png results/cavity_cfd_ghia/cfd_ghia_metrics.csv output/qa/cavity_notebook_execution.json lectures/week01_numerical_foundations.pdf lectures/week01_2_pressure_velocity.pdf lectures/week04_cavity_surrogates_deeponet.pdf lectures/week13_rectangular_cavity_pinn.pdf notebooks/week04/W4_Lab5_All_Re_Ghia_Validation.ipynb notebooks/week04/W4_Lab6_Ghia_Profile_Optimizer_Depth.ipynb notebooks/week13/W13_Deep_Cavity_D5_Regional_Accuracy.ipynb release_assets_v1.12.1_sha256.txt
