name: Week 15 capacity continuation
on:
  push:
    branches: [experiments/week15-capacity-geopt]
    paths: [results/week15_capacity/resume_bundle/manifest.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: week15-capacity-resume
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        variant: [scratch, geopt]
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install recorded CPU runtime
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.6 scipy einops
      - name: Restore and verify checkpoint bundle
        run: python qa/restore_capacity_bundle.py --variant ${{ matrix.variant }}
      - name: Download verified GeoPT initialization
        if: matrix.variant == 'geopt'
        run: python qa/download_geopt_checkpoint.py --output /tmp/geopt_weights
      - name: Continue the existing optimizer and sampling state
        shell: bash
        run: |
          extra=()
          if [ '${{ matrix.variant }}' = geopt ]; then extra=(--pretrained /tmp/geopt_weights/GeoPT_8layers.pt); fi
          python qa/train_family_transolver_large.py --resume --seed 17 --threads 2 --device cpu --output results/week15_capacity/transolver_8x256_${{ matrix.variant }} "${extra[@]}"
      - name: Preserve checkpoints and predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week15-capacity-${{ matrix.variant }}-seed17
          path: results/week15_capacity/transolver_8x256_${{ matrix.variant }}/seed_17/
          retention-days: 30
          if-no-files-found: error
