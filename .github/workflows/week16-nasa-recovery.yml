name: Week 16 NASA mesh-scaled limiter recovery
on:
  push:
    branches: [week16-reference-recovery]
    paths: ['.github/workflows/week16-nasa-recovery.yml']
permissions:
  contents: read
  actions: read
jobs:
  nasa:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - level: '2'
            freeze: 4000
          - level: '2.5'
            freeze: 5000
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '4'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxft2 libxinerama1 libxcursor1
      - run: pip install -r qa/week16/requirements.txt
      - run: python qa/week16/install_su2.py
      - name: Same mesh and flux, limiter freeze scaled with refinement
        run: SU2_CFD="$PWD/.tools/week16_su2/bin/SU2_CFD" python qa/week16/seeb_reference.py --level ${{ matrix.level }} --threads 4 --iterations 16000 --limiter-iter ${{ matrix.freeze }}
      - name: Preserve complete evidence including unsuccessful runs
        if: always()
        run: tar -czf nasa-level-${{ matrix.level }}.tar.gz results/week16_lowboom/reference/seeb_level_${{ matrix.level }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nasa-level-${{ matrix.level }}
          path: nasa-level-${{ matrix.level }}.tar.gz
          retention-days: 90
  compare:
    needs: nasa
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r qa/week16/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: nasa-level-*
          merge-multiple: true
      - run: gh run download 35935655513 --name nasa-level-1 --dir coarse_artifact
      - run: for archive in nasa-level-*.tar.gz coarse_artifact/*.tar.gz; do tar -xzf "$archive"; done
      - run: python qa/week16/reference_report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-nasa-comparison
          path: |
            results/week16_lowboom/reference/seeb_*.json
            results/week16_lowboom/reference/seeb_*.png
          retention-days: 90
      - run: python -c "import json; r=json.load(open('results/week16_lowboom/reference/seeb_validation.json')); assert r['passed'],r['checks']"
