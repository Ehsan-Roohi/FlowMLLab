name: Cylinder grid-independence validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cylinder-grid-independence
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Regenerate all three direct LBM solutions
        run: python qa/run_cylinder_grid_independence.py --regenerate --workers 2

      - name: Verify retained grid evidence and unit tests
        run: |
          python qa/run_cylinder_grid_independence.py
          python -m unittest tests.test_cylinder_lbm -v

      - name: Upload checksummed CFD evidence for review
        uses: actions/upload-artifact@v4
        with:
          name: cylinder-grid-convergence
          path: results/cylinder_grid_convergence/
          if-no-files-found: error
