name: Cylinder grid-independence validation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cylinder-grid-independence
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Regenerate all three direct LBM solutions
        run: python qa/run_cylinder_grid_independence.py --regenerate --workers 2

      - name: Verify retained grid evidence and unit tests
        run: |
          python qa/run_cylinder_grid_independence.py
          python -m unittest tests.test_cylinder_lbm -v

      - name: Commit checksummed CFD evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/cylinder_grid_convergence/
          if git diff --cached --quiet; then
            echo "Grid evidence is already current."
          else
            git commit -m "Regenerate cylinder grid-independence evidence"
            git push origin HEAD:main
          fi
