name: Rebuild Week 7 materials

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/week7-materials.yml"
      - "notebooks/week07/*.ipynb"
      - "qa/execute_published_notebooks.py"
      - "lectures/source/lecture_typography.tex"
      - "qa/lecture_typography.py"
      - "qa/LECTURE_TYPOGRAPHY.md"
      - "notebooks/week07/make_week7_notebook.py"
      - "lectures/source/week07_cylinder_lbm_neural_surrogate.tex"
      - "results/cylinder_grid_convergence/**"
      - "results/cylinder_phase/**"

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python and LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk poppler-utils texlive-latex-extra texlive-fonts-recommended texlive-xetex fontconfig fonts-dejavu-core cabextract curl
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Install the recorded Times New Roman build fonts
        run: |
          # Exact original installer documented in qa/LECTURE_TYPOGRAPHY.md.
          font_installer="$RUNNER_TEMP/flowmllab-times32.exe"
          font_dir="$HOME/.local/share/fonts/msttcorefonts"
          curl --fail --location --retry 3 --output "$font_installer" \
            https://downloads.sourceforge.net/corefonts/times32.exe
          printf '%s  %s\n' 'db56595ec6ef5d3de5c24994f001f03b2a13e37cee27bc25c58f6f43e8f807ab' "$font_installer" | sha256sum --check -
          mkdir -p "$font_dir"
          cabextract -q -d "$font_dir" "$font_installer"
          fc-cache -f "$font_dir"
          python qa/lecture_typography.py

      # Published notebooks are canonical; legacy generators omit later additions.
      - name: Execute the published notebook against retained evidence
        run: >-
          python qa/execute_published_notebooks.py --profile week7-retained
          notebooks/week07/W7_Lattice_Boltzmann_Cylinder_Student.ipynb

      - name: Check Week 7 lecture source compilation
        run: |
          mkdir -p "$RUNNER_TEMP/week7-lecture"
          latexmk -xelatex -interaction=nonstopmode -halt-on-error \
            -outdir="$RUNNER_TEMP/week7-lecture" lectures/source/week07_cylinder_lbm_neural_surrogate.tex
          test -s "$RUNNER_TEMP/week7-lecture/week07_cylinder_lbm_neural_surrogate.pdf"
          pdfinfo "$RUNNER_TEMP/week7-lecture/week07_cylinder_lbm_neural_surrogate.pdf"

      - name: Run software and release gates
        run: |
          python -m pytest -q tests
          python qa/validate_course_release.py

      - name: Verify generated teaching artifacts
        run: |
          git diff --exit-code -- notebooks/week07/W7_Lattice_Boltzmann_Cylinder_Student.ipynb
          test -s lectures/week07_cylinder_lbm_neural_surrogate.pdf
          pdfinfo lectures/week07_cylinder_lbm_neural_surrogate.pdf
