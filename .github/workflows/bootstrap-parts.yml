name: Bootstrap standalone source from parts

on:
  push:
    branches: [main]
    paths: [flowmllab-source.zip.part-00, flowmllab-source.zip.part-01]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand validated source package
        run: |
          cat flowmllab-source.zip.part-* > flowmllab-source.zip
          unzip -o flowmllab-source.zip
          rm flowmllab-source.zip flowmllab-source.zip.part-*
          rm .github/workflows/bootstrap.yml .github/workflows/bootstrap-parts.yml
      - name: Commit standalone source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release FlowMLLab v1.0.0"
          git push
