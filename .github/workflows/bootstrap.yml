name: Bootstrap standalone source

on:
  push:
    branches: [main]
    paths: [flowmllab-source.zip]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand validated source package
        run: |
          unzip -o flowmllab-source.zip
          rm flowmllab-source.zip
          rm .github/workflows/bootstrap.yml
      - name: Commit standalone source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release FlowMLLab v1.0.0"
          git push
