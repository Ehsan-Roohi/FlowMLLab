name: FlowMLLab CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install system QA dependency
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install FlowMLLab
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Package tests
        run: python -m unittest discover -s tests -v
      - name: Core scientific smoke test
        run: flowmllab smoke --root .
      - name: Full release QA
        run: flowmllab qa --root .
