name: Rebuild and verify Week 9 materials

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/week9-materials.yml"
      - "flowmllab/mahdavi_deeponet.py"
      - "flowmllab/step_geom_deeponet.py"
      - "notebooks/week09/make_week9_notebooks.py"
      - "qa/build_step_height_archive.py"
      - "qa/build_step_article_contours.py"
      - "qa/build_step_independent_contours.py"
      - "qa/run_nozzle_field_validation.py"
      - "qa/run_step_height_teaching_validation.py"
      - "qa/run_step_geom_deeponet.py"
      - "qa/build_week9_mahdavi_deeponet_data.py"
      - "results/mahdavi_deeponet/**"
      - "lectures/source/week09_rarefied_deeponet_case_studies.tex"
      - "lectures/week09_rarefied_deeponet_case_studies.pdf"
      - "tests/test_mahdavi_deeponet.py"
      - "tests/test_step_geom_deeponet.py"

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out pinned micro-step source data
        uses: actions/checkout@v4
        with:
          repository: Ehsan-Roohi/roohi-step-dnn-mahdavi
          ref: c3f211376b42b8dc30daad380eaef5e0ab800b5c
          path: .external/roohi-step-dnn-mahdavi
          sparse-checkout: |
            data/height/smoothed
            data/kn/smoothed/Kn=0-004_smoothed.dat
            data/kn/smoothed/Kn=0-02_smoothed.dat
            data/kn/smoothed/Kn=1_smoothed.dat
            results/height/full_data/tecplot_pred
            results/kn/best_run_seed_2035/tecplot_pred
          sparse-checkout-cone-mode: false

      - name: Check out pinned micro-nozzle DSMC data
        uses: actions/checkout@v4
        with:
          repository: Ehsan-Roohi/roohi-nozzle-pod-reproducibility
          ref: e1b234ba499408d3b6224633972f939f3b2301d6
          path: .external/roohi-nozzle-pod-reproducibility
          sparse-checkout: |
            data
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PDF build and validation utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk poppler-utils texlive-latex-extra texlive-fonts-recommended

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps

      - name: Rebuild student notebooks
        run: python notebooks/week09/make_week9_notebooks.py

      - name: Rebuild Week 9 lecture PDF
        working-directory: lectures/source
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error week09_rarefied_deeponet_case_studies.tex
          cp week09_rarefied_deeponet_case_studies.pdf ../week09_rarefied_deeponet_case_studies.pdf

      - name: Reproduce independent step validation
        run: |
          python qa/run_step_height_teaching_validation.py --root .
          git diff --exit-code -- \
            results/mahdavi_deeponet/step_teaching_selection.csv \
            results/mahdavi_deeponet/step_teaching_test_metrics.csv \
            results/mahdavi_deeponet/step_teaching_protocol.json

      - name: Rebuild exact article-case contours
        run: |
          python qa/build_step_article_contours.py \
            --source .external/roohi-step-dnn-mahdavi --root .
          python qa/build_step_independent_contours.py --root .
          test -s results/mahdavi_deeponet/step_article_contour_metrics.csv
          test -s results/mahdavi_deeponet/step_article_case_coverage.csv
          test -s results/mahdavi_deeponet/step_independent_contour_metrics.csv

      - name: Rebuild nozzle DSMC derivatives and held-out fields
        run: |
          python qa/build_week9_mahdavi_deeponet_data.py \
            --source .external/roohi-nozzle-pod-reproducibility --root .
          python qa/run_nozzle_field_validation.py --root .
          test -s results/mahdavi_deeponet/nozzle_centerline_15cases.npz
          test -s results/mahdavi_deeponet/nozzle_fields_15cases.npz
          test -s results/mahdavi_deeponet/nozzle_flowmllab_heldout_metrics.csv
          test -s results/mahdavi_deeponet/nozzle_flowmllab_manifest.json

      - name: Run software and release gates
        run: |
          python -m unittest discover -s tests -v
          flowmllab mahdavi --root . \
            --step-source .external/roohi-step-dnn-mahdavi \
            --require-step-data
          python qa/validate_course_release.py

      - name: Verify generated teaching artifacts
        run: |
          git diff --exit-code -- \
            notebooks/week09/W9_Lab1_Microstep_Zonal_DeepONet_Student.ipynb \
            notebooks/week09/W9_Lab2_Shock_Aligned_Nozzle_DeepONet_Student.ipynb
          test -s lectures/week09_rarefied_deeponet_case_studies.pdf
          test -s results/mahdavi_deeponet/nozzle_flowmllab/nozzle_back_pressure_profiles.png
          pdfinfo lectures/week09_rarefied_deeponet_case_studies.pdf
