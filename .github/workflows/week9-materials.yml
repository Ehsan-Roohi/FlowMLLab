name: Rebuild and verify Week 9 materials

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/week9-materials.yml"
      - "flowmllab/mahdavi_deeponet.py"
      - "notebooks/week09/make_week9_notebooks.py"
      - "qa/build_step_height_archive.py"
      - "qa/build_step_article_contours.py"
      - "qa/build_step_leakage_free_contours.py"
      - "qa/run_step_height_teaching_validation.py"
      - "qa/build_week9_mahdavi_deeponet_data.py"
      - "results/mahdavi_deeponet/**"
      - "tests/test_mahdavi_deeponet.py"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out pinned micro-step source data
        uses: actions/checkout@v4
        with:
          repository: Ehsan-Roohi/roohi-step-dnn-mahdavi
          ref: c3f211376b42b8dc30daad380eaef5e0ab800b5c
          path: .external/roohi-step-dnn-mahdavi
          sparse-checkout: |
            data/height/smoothed
            data/kn/smoothed/Kn=0-004_smoothed.dat
            data/kn/smoothed/Kn=0-02_smoothed.dat
            data/kn/smoothed/Kn=1_smoothed.dat
            results/height/full_data/tecplot_pred
            results/kn/best_run_seed_2035/tecplot_pred
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PDF validation utility
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Rebuild student notebooks
        run: python notebooks/week09/make_week9_notebooks.py

      - name: Reproduce leakage-free step validation
        run: |
          python qa/run_step_height_teaching_validation.py --root .
          git diff --exit-code -- \
            results/mahdavi_deeponet/step_teaching_selection.csv \
            results/mahdavi_deeponet/step_teaching_test_metrics.csv \
            results/mahdavi_deeponet/step_teaching_protocol.json

      - name: Rebuild exact article-case contours
        run: |
          python qa/build_step_article_contours.py \
            --source .external/roohi-step-dnn-mahdavi --root .
          python qa/build_step_leakage_free_contours.py --root .
          git diff --exit-code -- \
            results/mahdavi_deeponet/step_article_contour_metrics.csv \
            results/mahdavi_deeponet/step_article_case_coverage.csv \
            results/mahdavi_deeponet/step_leakage_free_contour_metrics.csv

      - name: Run software and release gates
        run: |
          python -m unittest discover -s tests -v
          flowmllab mahdavi --root . \
            --step-source .external/roohi-step-dnn-mahdavi \
            --require-step-data
          python qa/validate_course_release.py

      - name: Commit generated notebooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/week09/W9_Lab1_Microstep_Zonal_DeepONet_Student.ipynb
          git add notebooks/week09/W9_Lab2_Shock_Aligned_Nozzle_DeepONet_Student.ipynb
          if git diff --cached --quiet; then
            echo "Week 9 notebooks are already current."
          else
            git commit -m "Rebuild Week 9 notebook artifacts [skip ci]"
            git push origin HEAD:main
          fi
