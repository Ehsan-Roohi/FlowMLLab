name: Python package check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "flowmllab/**"
      - "tests/**"
      - "qa/**"
      - "notebooks/**"
      - "results/cylinder_lbm/**"
      - "results/cylinder_grid_convergence/**"
      - "pyproject.toml"
      - "CITATION.cff"
      - "README.md"
      - ".github/workflows/package-check.yml"

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Verify isolated wheel import and CLI
        run: |
          python -m venv /tmp/flowmllab-wheel-check
          /tmp/flowmllab-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/flowmllab-wheel-check/bin/flowmllab --version
          cd /tmp
          /tmp/flowmllab-wheel-check/bin/flowmllab smoke
      - name: Retain distributions for maintainer inspection
        uses: actions/upload-artifact@v6
        with:
          name: flowmllab-python-distributions
          path: dist/
          if-no-files-found: error
