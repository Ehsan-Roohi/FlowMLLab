name: Rebuild Week 8 materials

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/week8-materials.yml"
      - "flowmllab/gas_dynamics.py"
      - "notebooks/week08/make_week8_notebooks.py"
      - "lectures/source/week08_gas_dynamics_sciml.tex"
      - "qa/build_week8_gas_dynamics_figures.py"
      - "qa/run_week8_scattered_baseline.py"
      - "results/gas_dynamics_week8/*.csv"
      - "results/gas_dynamics_week8/*.json"

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python and LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk poppler-utils texlive-latex-extra texlive-fonts-recommended
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Rebuild figures and student notebooks
        run: |
          python qa/run_week8_scattered_baseline.py
          python qa/build_week8_gas_dynamics_figures.py
          python notebooks/week08/make_week8_notebooks.py

      - name: Rebuild Week 8 lecture PDF
        working-directory: lectures/source
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error week08_gas_dynamics_sciml.tex
          cp week08_gas_dynamics_sciml.pdf ../week08_gas_dynamics_sciml.pdf

      - name: Run software and release gates
        run: |
          python -m unittest discover -s tests -v
          python qa/validate_course_release.py

      - name: Verify generated teaching artifacts
        run: |
          git diff --exit-code -- \
            notebooks/week08/W8_Lab1_Exact_Gas_Dynamics_Student.ipynb \
            notebooks/week08/W8_Lab2_Gas_Dynamics_SciML_Evidence_Student.ipynb \
            results/gas_dynamics_week8/scattered_baseline.csv
          test -s lectures/week08_gas_dynamics_sciml.pdf
          test -s results/gas_dynamics_week8/week8_exact_physics.pdf
          test -s results/gas_dynamics_week8/week8_model_evidence.pdf
          pdfinfo lectures/week08_gas_dynamics_sciml.pdf
