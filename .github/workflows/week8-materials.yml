name: Rebuild Week 8 materials

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/week8-materials.yml"
      - "notebooks/week08/*.ipynb"
      - "qa/execute_published_notebooks.py"
      - "lectures/source/lecture_typography.tex"
      - "qa/lecture_typography.py"
      - "qa/LECTURE_TYPOGRAPHY.md"
      - "flowmllab/gas_dynamics.py"
      - "notebooks/week08/make_week8_notebooks.py"
      - "lectures/source/week08_gas_dynamics_sciml.tex"
      - "qa/build_week8_gas_dynamics_figures.py"
      - "qa/run_week8_scattered_baseline.py"
      - "tests/test_week8_scattered_baseline.py"
      - "results/gas_dynamics_week8/*.csv"
      - "results/gas_dynamics_week8/*.json"

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python and LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk poppler-utils texlive-latex-extra texlive-fonts-recommended texlive-xetex fontconfig fonts-dejavu-core cabextract curl
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Install the recorded Times New Roman build fonts
        run: |
          # Exact original installer documented in qa/LECTURE_TYPOGRAPHY.md.
          font_installer="$RUNNER_TEMP/flowmllab-times32.exe"
          font_dir="$HOME/.local/share/fonts/msttcorefonts"
          curl --fail --location --retry 3 --output "$font_installer" \
            https://downloads.sourceforge.net/corefonts/times32.exe
          printf '%s  %s\n' 'db56595ec6ef5d3de5c24994f001f03b2a13e37cee27bc25c58f6f43e8f807ab' "$font_installer" | sha256sum --check -
          mkdir -p "$font_dir"
          cabextract -q -d "$font_dir" "$font_installer"
          fc-cache -f "$font_dir"
          python qa/lecture_typography.py

      - name: Verify numerical reproduction and rebuild figures
        run: |
          # Preserve the frozen CSV byte-for-byte. Only the two recomputed error
          # norms admit documented BLAS/LAPACK roundoff; metadata stays exact.
          python qa/run_week8_scattered_baseline.py \
            --output "$RUNNER_TEMP/week8-scattered/scattered_baseline.csv" \
            --compare-to results/gas_dynamics_week8/scattered_baseline.csv
          python qa/build_week8_gas_dynamics_figures.py

      # Published notebooks are canonical; legacy generators omit later additions.
      - name: Execute the published notebooks without replacing them
        run: >-
          python qa/execute_published_notebooks.py
          notebooks/week08/W8_Lab1_Exact_Gas_Dynamics_Student.ipynb
          notebooks/week08/W8_Lab2_Gas_Dynamics_SciML_Evidence_Student.ipynb

      - name: Check Week 8 lecture source compilation
        run: |
          mkdir -p "$RUNNER_TEMP/week8-lecture"
          latexmk -xelatex -interaction=nonstopmode -halt-on-error \
            -outdir="$RUNNER_TEMP/week8-lecture" lectures/source/week08_gas_dynamics_sciml.tex
          test -s "$RUNNER_TEMP/week8-lecture/week08_gas_dynamics_sciml.pdf"
          pdfinfo "$RUNNER_TEMP/week8-lecture/week08_gas_dynamics_sciml.pdf"

      - name: Run software and release gates
        run: |
          python -m pytest -q tests
          python qa/validate_course_release.py

      - name: Verify generated teaching artifacts
        run: |
          git diff --exit-code -- \
            notebooks/week08/W8_Lab1_Exact_Gas_Dynamics_Student.ipynb \
            notebooks/week08/W8_Lab2_Gas_Dynamics_SciML_Evidence_Student.ipynb \
            results/gas_dynamics_week8/scattered_baseline.csv
          test -s lectures/week08_gas_dynamics_sciml.pdf
          test -s results/gas_dynamics_week8/week8_exact_physics.pdf
          test -s results/gas_dynamics_week8/week8_model_evidence.pdf
          pdfinfo lectures/week08_gas_dynamics_sciml.pdf
