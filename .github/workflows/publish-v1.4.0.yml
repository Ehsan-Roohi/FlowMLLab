name: Publish FlowMLLab v1.4.0

on:
  push:
    tags: [v1.4.0]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'Ehsan-Roohi/FlowMLLab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.4.0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install validation and packaging dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          python -m pip install -e ".[test]" build twine
      - name: Verify version and scientific release
        run: |
          python -c "import flowmllab; assert flowmllab.__version__ == '1.4.0'"
          python -m unittest discover -s tests -v
          flowmllab smoke --root .
          python qa/validate_course_release.py
      - name: Build distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Publish the reviewed tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.4.0 >/dev/null 2>&1; then
            echo "Release v1.4.0 already exists; leaving it unchanged."
          else
            gh release create v1.4.0 --verify-tag \
              --title "FlowMLLab v1.4.0 — Rarefied cylinder and complete course gallery" \
              --notes-file RELEASE_NOTES_v1.4.0.md \
              dist/* \
              lectures/week07_1_hypersonic_rarefied_cylinder.pdf \
              results/hypersonic_cylinder_week7_1/cylinder_homepage.png
          fi
