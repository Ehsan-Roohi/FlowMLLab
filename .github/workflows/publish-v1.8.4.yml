name: Publish FlowMLLab v1.8.4
on:
  push:
    tags: [v1.8.4]
    branches: [main]
    paths: [.github/workflows/publish-v1.8.4.yml]
permissions:
  contents: write
jobs:
  release:
    if: github.repository == 'Ehsan-Roohi/FlowMLLab'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test and packaging dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          python -m pip install -e '.[test]' build twine
      - name: Test release
        run: |
          python -c "import flowmllab; assert flowmllab.__version__ == '1.8.4'"
          python -m pytest -q tests qa
          flowmllab smoke --root .
          flowmllab qa --root .
          python qa/validate_course_release.py
          git diff --exit-code
      - name: Download and verify frozen Week 15 evidence
        run: |
          curl -L --fail --retry 3 \
            -o ../FlowMLLab_Week15_PostAudit_LR_Sweep.zip \
            https://zenodo.org/api/records/22840293/files/FlowMLLab_Week15_PostAudit_LR_Sweep.zip/content
          echo 'e9f6e1c05bec59be4cee759f721bc8ccbc78119d22a00a31304932103f0ca9d9  ../FlowMLLab_Week15_PostAudit_LR_Sweep.zip' | sha256sum --check
          unzip -q ../FlowMLLab_Week15_PostAudit_LR_Sweep.zip -d ..
      - name: Execute Week 15 flagship with a real Jupyter kernel
        env:
          FLOWMLLAB_WEEK15_LR_DIR: ${{ github.workspace }}/../FlowMLLab_Week15_PostAudit_LR_Sweep
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient

          path = Path('notebooks/week15/W15_Complete_Geometry_Generalization.ipynb')
          notebook = nbformat.read(path, as_version=4)
          NotebookClient(
              notebook,
              timeout=600,
              kernel_name='python3',
              resources={'metadata': {'path': str(path.parent)}},
          ).execute()
          errors = [
              output
              for cell in notebook.cells if cell.cell_type == 'code'
              for output in cell.get('outputs', []) if output.output_type == 'error'
          ]
          assert not errors
          assert sum(cell.cell_type == 'code' for cell in notebook.cells) == 15
          print('WEEK15_REAL_KERNEL_PASS: 15 code cells')
          PY
          git diff --exit-code
      - name: Build distributions and the asset hash list
        run: |
          python -m build
          python -m twine check dist/*
          rm -rf output
          sha256sum dist/flowmllab-1.8.4-py3-none-any.whl dist/flowmllab-1.8.4.tar.gz \
            lectures/week15_geometry_generalization.pdf | sed 's# dist/# #; s# lectures/# #' \
            > release_assets_v1.8.4_sha256.txt
          cat release_assets_v1.8.4_sha256.txt
      - name: Publish without modifying previous releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.8.4 >/dev/null 2>&1; then
            echo 'Existing v1.8.4 left unchanged.'
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            gh release create v1.8.4 --verify-tag --latest \
              --title 'FlowMLLab v1.8.4 - Review follow-ups' \
              --notes-file RELEASE_NOTES_v1.8.4.md dist/* \
              lectures/week15_geometry_generalization.pdf \
              release_assets_v1.8.4_sha256.txt
          else
            gh release create v1.8.4 --target "$GITHUB_SHA" --latest \
              --title 'FlowMLLab v1.8.4 - Review follow-ups' \
              --notes-file RELEASE_NOTES_v1.8.4.md dist/* \
              lectures/week15_geometry_generalization.pdf \
              release_assets_v1.8.4_sha256.txt
          fi
