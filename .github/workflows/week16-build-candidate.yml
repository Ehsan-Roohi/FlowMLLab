name: Build verified Week 16 publication candidate
on:
  push:
    branches: [week16-reference-recovery]
    paths: ['.github/workflows/week16-build-candidate.yml']
permissions:
  contents: write
  actions: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stop superseded waiting controllers
        run: |
          gh run cancel 35944635654 --repo Ehsan-Roohi/FlowMLLab || true
          gh run cancel 35945740747 --repo Ehsan-Roohi/FlowMLLab || true
      - name: Wait for accepted reference and clean-model evidence
        run: |
          gh run watch 35946027208 --exit-status --interval 30
          gh run watch 35944888983 --exit-status --interval 30
      - name: Install teaching and validation dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils libglu1-mesa
          pip install -r qa/week16/requirements.txt pytest==8.4.2 pytest-subtests jinja2 pypdf==6.10.0
      - name: Retrieve immutable raw and compact evidence
        run: bash qa/week16/fetch_reference_evidence.sh
      - name: Recompute every reference report and enforce scientific gates
        run: |
          python qa/week16/nasa_reference_data.py
          python qa/week16/reference_report.py
          python qa/week16/independent_audit_report.py
          python qa/week16/freeze_model.py
          python qa/week16/recompute_neural_cfd.py --report
          python qa/week16/weakwall_report.py --check-only
          python qa/week16/weakwall_design_report.py --check-only
          python qa/week16/cone_refinement_v801.py --report
          python qa/week16/clean_campaign_v801.py --assemble --check-only
          python qa/week16/clean_model_v801.py --check-only
          python qa/week16/geometry_volume_audit.py
          python qa/week16/validate_reference.py
          python qa/week16/clean_figures.py --raw-root results/week16_lowboom/runs
      - name: Build lecture and execute notebook with a real Jupyter kernel
        run: |
          python qa/week16/build_materials.py
          python -m pytest -q tests qa
      - name: Record evidence and leave final visual approval incomplete
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from pypdf import PdfReader
          e=Path('results/week16_lowboom');r=e/'reference'
          cfd=json.loads((r/'seeb_validation.json').read_text())
          nn=json.loads((r/'clean_model_audit_v801.json').read_text())
          campaign=json.loads((r/'clean_campaign_audit.json').read_text())
          design=json.loads((r/'weakwall_design_audit.json').read_text())
          cone=json.loads((r/'cone_refinement_v801.json').read_text())
          report=json.loads((e/'release_check.json').read_text())
          report.setdefault('historical_scientific_checks',report['scientific_checks'])
          report['scientific_checks']={'clean_44_case_physical_and_numerical_checks':campaign['passed'],'new_clean_neural_model':nn['passed'],'retained_design_recomputation':design['passed'],'Taylor_Maccoll_refined_family':cone['passed'],'NASA_three_mesh_experimental_comparison':cfd['passed']}
          report['scientific_checks']['actual_exported_wall_volume_within_0p2pct']=json.loads((r/'geometry_volume_audit.json').read_text())['passed']
          report['scientific_pass']=all(report['scientific_checks'].values())
          report['reference_extension']={'passed':report['scientific_pass'],'NASA_meshes':len(cfd['runs']),'clean_cases':44,'finer_neural_cases':8,'NASA_workflow_run':35946027208,'NASA_coarse_workflow_run':35944409924,'neural_workflow_run':35942843724,'clean_campaign_workflow_run':35944299803,'clean_model_workflow_run':35944888983,'design_workflow_run':35943668623,'cone_workflow_run':35943668572}
          report['notebook_executed']=True
          report['notebook_execution_method']='nbclient with a real Jupyter kernel'
          report['lecture_visual_review']=False
          report['release_ready']=False
          report['lecture_pages']=len(PdfReader('lectures/week16_supersonic_shape_optimization.pdf').pages)
          report['validation_candidate_commit']=__import__('os').environ['GITHUB_SHA']
          (e/'release_check.json').write_text(json.dumps(report,indent=2)+'\n')
          sources=sorted(set(Path('qa/week16').glob('*.py'))|set(Path('notebooks/week16').glob('*.md'))|{Path('lectures/source/week16_supersonic_shape_optimization.md')})
          (r/'release_source_sha256.json').write_text(json.dumps({str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in sources},indent=2)+'\n')
          PY
          python qa/week16/package_reference.py
      - uses: actions/upload-artifact@v4
        with:
          name: week16-publication-candidate
          path: |
            lectures/week16_supersonic_shape_optimization.pdf
            notebooks/week16/W16_Supersonic_Shape_Optimization.ipynb
            results/week16_lowboom/reference/*.json
            results/week16_lowboom/reference/*.npz
            results/week16_lowboom/reference/*.png
            results/week16_lowboom/reference/*.svg
            results/week16_lowboom/reference/reference_evidence.zip
            results/week16_lowboom/release_check.json
          retention-days: 90
      - name: Preserve generated candidate on the development branch
        run: |
          git fetch origin week16-reference-recovery
          test "$(git rev-parse origin/week16-reference-recovery)" = "$GITHUB_SHA"
          git config user.name 'FlowMLLab validation'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add lectures/week16_supersonic_shape_optimization.pdf notebooks/week16/W16_Supersonic_Shape_Optimization.ipynb results/week16_lowboom/release_check.json
          git add results/week16_lowboom/reference/*.json results/week16_lowboom/reference/*.npz results/week16_lowboom/reference/*.png results/week16_lowboom/reference/reference_evidence.zip
          git commit -m 'Retain passed CFD reference evidence and executed Week 16 candidate; visual review pending'
          git push origin HEAD:week16-reference-recovery
