name: Rebuild and verify Week 10 materials

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/week10-materials.yml"
      - "qa/execute_published_notebooks.py"
      - "lectures/source/lecture_typography.tex"
      - "qa/lecture_typography.py"
      - "qa/LECTURE_TYPOGRAPHY.md"
      - "flowmllab/aescte_dsmc.py"
      - "data/aescte_dsmc/**"
      - "notebooks/week10/**"
      - "qa/build_week10_aescte_dsmc_data.py"
      - "qa/run_week10_aescte_validation.py"
      - "results/aescte_dsmc/**"
      - "lectures/source/week10_dsmc_data_driven_surrogates.tex"
      - "lectures/week10_dsmc_data_driven_surrogates.pdf"
      - "tests/test_aescte_dsmc.py"

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and PDF inspector
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk poppler-utils texlive-latex-extra texlive-fonts-recommended texlive-xetex fontconfig fonts-dejavu-core cabextract curl
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Install the recorded Times New Roman build fonts
        run: |
          # Exact original installer documented in qa/LECTURE_TYPOGRAPHY.md.
          font_installer="$RUNNER_TEMP/flowmllab-times32.exe"
          font_dir="$HOME/.local/share/fonts/msttcorefonts"
          curl --fail --location --retry 3 --output "$font_installer" \
            https://downloads.sourceforge.net/corefonts/times32.exe
          printf '%s  %s\n' 'db56595ec6ef5d3de5c24994f001f03b2a13e37cee27bc25c58f6f43e8f807ab' "$font_installer" | sha256sum --check -
          mkdir -p "$font_dir"
          cabextract -q -d "$font_dir" "$font_installer"
          fc-cache -f "$font_dir"
          python qa/lecture_typography.py

      - name: Rebuild deterministic numerical evidence and check lecture source
        run: |
          python qa/build_week10_aescte_dsmc_data.py
          python qa/run_week10_aescte_validation.py
          mkdir -p "$RUNNER_TEMP/week10-lecture"
          latexmk -xelatex -interaction=nonstopmode -halt-on-error \
            -outdir="$RUNNER_TEMP/week10-lecture" lectures/source/week10_dsmc_data_driven_surrogates.tex
          test -s "$RUNNER_TEMP/week10-lecture/week10_dsmc_data_driven_surrogates.pdf"
          pdfinfo "$RUNNER_TEMP/week10-lecture/week10_dsmc_data_driven_surrogates.pdf"
      # Published notebooks are canonical; legacy generators omit later additions.
      - name: Execute the published notebook without replacing it
        run: >-
          python qa/execute_published_notebooks.py
          notebooks/week10/W10_DSMC_Data_Driven_Surrogates_Student.ipynb
      - name: Verify deterministic artifacts
        run: |
          git diff --exit-code -- \
            notebooks/week10/W10_DSMC_Data_Driven_Surrogates_Student.ipynb \
            results/aescte_dsmc/cavity_fields_14cases.npz \
            results/aescte_dsmc/diatomic_shock_6cases.npz \
            results/aescte_dsmc/monatomic_shock_7cases.npz \
            results/aescte_dsmc/data_manifest.json
          test -s lectures/week10_dsmc_data_driven_surrogates.pdf
          python -m unittest tests.test_aescte_dsmc -v
          pdfinfo lectures/week10_dsmc_data_driven_surrogates.pdf
