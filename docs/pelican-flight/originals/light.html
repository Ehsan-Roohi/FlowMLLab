<main><svg viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Postal Pelican</title><desc id="desc">A pelican pedals a little postal aircraft, takes off, loops through a cloud and returns to the runway in twelve seconds.</desc>

</svg><nav><button id="toggle">Pause</button><button id="restart">Restart</button></nav></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),tau=2*Math.PI,S=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)},P=x=>x*x*x-x*x*x*x/2;
function revolutions(t){return 18*(t<1?P(t):t<10?t-.5:9.5+2*((t-10)/2-P((t-10)/2)))/10.5}
const nodes=[[0,360,520,0,0],[3,360,520,0,0],[4.5,510,520,160,0],[6,900,400,190,-150],[7,1000,230,0,-90],[8,720,200,-250,0],[9,350,300,-160,150],[10.5,250,520,100,0],[11.5,360,520,0,0],[12,360,520,0,0]];
function route(t){let i=0;while(i<nodes.length-2&&t>nodes[i+1][0])i++;let a=nodes[i],b=nodes[i+1],h=b[0]-a[0],u=(t-a[0])/h;const pos=k=>(2*u**3-3*u*u+1)*a[k]+(u**3-2*u*u+u)*h*a[k+2]+(-2*u**3+3*u*u)*b[k]+(u**3-u*u)*h*b[k+2],vel=k=>((6*u*u-6*u)*a[k]+(3*u*u-4*u+1)*h*a[k+2]+(-6*u*u+6*u)*b[k]+(3*u*u-2*u)*h*b[k+2])/h;return {x:pos(1),y:pos(2),angle:Math.atan2(vel(2),vel(1))}}
// 24 and 12 pitch teeth, 60 links: solve the exact tangent belt length.
const R=24,r=12,pitch=tau*R/24;let lo=66,hi=200;for(let i=0;i<70;i++){let d=(lo+hi)/2,alpha=Math.acos((R-r)/d),length=2*Math.sqrt(d*d-(R-r)**2)+2*r*alpha+R*(tau-2*alpha);if(length<60*pitch)lo=d;else hi=d}const d=(lo+hi)/2,bx=Math.sqrt(d*d-65*65),by=-40,base=Math.atan2(-65,bx),alpha=Math.acos(12/d),point=(x,y,r,a)=>[x+r*Math.cos(a),y+r*Math.sin(a)];
const a=point(0,25,R,base-alpha),b=point(bx,by,r,base-alpha),c=point(bx,by,r,base+alpha),e=point(0,25,R,base+alpha),chain=`M${a}L${b}A12 12 0 0 1 ${c}L${e}A24 24 0 1 1 ${a}Z`;
$('gearMount').setAttribute('transform',`translate(${bx} ${by})`);for(const id of ['belt','links'])$(id).setAttribute('d',chain);$('links').setAttribute('stroke-dasharray',`${pitch*.4} ${pitch*.6}`);
function leg(side,a,hx){const x=24*Math.cos(a),y=25+24*Math.sin(a),dx=x-4-hx,dy=y-6+37,D=Math.hypot(dx,dy),L=56,q=Math.sqrt(Math.max(0,L*L-D*D/4));$('leg'+side).setAttribute('d',`M${hx} -37L${hx+dx/2-dy/D*q} ${-37+dy/2+dx/D*q}L${x-4} ${y-6}`);$('foot'+side).setAttribute('transform',`translate(${x} ${y})`)}
function draw(t){const f=route(t),a=tau*revolutions(t);$('craft').setAttribute('transform',`translate(${f.x} ${f.y}) rotate(${f.angle*S((520-f.y)/230)*180/Math.PI})`);$('crank').setAttribute('transform',`rotate(${a*180/Math.PI})`);$('gear').setAttribute('transform',`rotate(${a*360/Math.PI})`);$('links').setAttribute('stroke-dashoffset',-24*a);leg('Back',a+Math.PI,-29);leg('Front',a,-39);
for(let i=0;i<3;i++){const p=2*a+i*tau/3,x=12*Math.cos(p),y=62*Math.sin(p),vx=3*Math.sin(p),vy=-6*Math.cos(p);$('p'+i).setAttribute('d',`M${157+vx} ${-40+vy}Q${157+x+vx} ${-40+y+vy} ${157+x} ${-40+y}Q${157+x-vx} ${-40+y-vy} ${157-vx} ${-40-vy}Z`)}
let wheel;if(t<=4.5)wheel=(f.x-360)/19;else if(t<10.5){const u=(t-4.5)/6,start=150/19,end=6*tau-110/19;wheel=(2*u**3-3*u*u+1)*start+(u**3-2*u*u+u)*6*160/19+(-2*u**3+3*u*u)*end+(u**3-u*u)*6*100/19}else wheel=6*tau-110/19+(f.x-250)/19;for(const id of ['w1','w2'])$(id).setAttribute('transform',`rotate(${wheel*180/Math.PI})`);
const happy=S((t-6)/.5)*(1-S((t-9)/.5));$('eye').setAttribute('opacity',1-happy);$('smile').setAttribute('opacity',happy);const wave=5*Math.sin(2*a)*S(t)*(1-S((t-10)/2));$('scarf').setAttribute('d',`M0-106L-49 ${-112+wave}-37 ${-95+wave}1-100Z`);$('shadow').setAttribute('cx',f.x);$('shadow').setAttribute('rx',145-(520-f.y)*.2);$('shadow').setAttribute('opacity',.16-(520-f.y)*.0003)}
let t=0,last=null,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;function label(){$('toggle').textContent=paused?'Play':'Pause';$('toggle').setAttribute('aria-pressed',String(paused))}$('toggle').onclick=()=>{paused=!paused;last=null;label()};$('restart').onclick=()=>{t=0;last=null;draw(0)};document.addEventListener('visibilitychange',()=>last=null);function tick(now){if(last!==null&&!paused&&!document.hidden)t=(t+(now-last)/1000)%12;last=now;draw(t);requestAnimationFrame(tick)}draw(0);label();requestAnimationFrame(tick);
})();
</script></html>
