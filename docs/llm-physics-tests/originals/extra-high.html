<div id="hexlab-v1" dir="rtl">
  <div class="viz-controls">
    <label class="form-label" for="hex-omega">سرعت چرخش <output id="hex-omega-out" dir="ltr">0.70 rad/s</output><input class="form-range" id="hex-omega" type="range" min="-3" max="3" step="0.05" value="0.7" dir="ltr"></label>
    <label class="form-label" for="hex-gravity">گرانش <output id="hex-gravity-out" dir="ltr">9.81 m/s²</output><input class="form-range" id="hex-gravity" type="range" min="0" max="20" step="0.01" value="9.81" dir="ltr"></label>
    <label class="form-label" for="hex-bounce">ضریب بازگشت <output id="hex-bounce-out" dir="ltr">0.85</output><input class="form-range" id="hex-bounce" type="range" min="0" max="1" step="0.01" value="0.85" dir="ltr"></label>
  </div>
  <div class="viz-row">
    <button type="button" class="btn btn-primary" id="hex-pause">توقف</button>
    <button type="button" class="btn" id="hex-restart">آغاز دوباره</button>
    <span class="text-small" id="hex-time" dir="ltr">t = 0.00 s</span>
    <span class="text-small">دیوارهٔ صاف، بدون اصطکاک</span><span class="text-small" dir="ltr">R = 1 m · m = 1 kg</span>
  </div>
  <svg id="hex-view" viewBox="-1.35 -1.14 2.7 2.28" role="img" aria-label="توپ داخل شش‌ضلعی چرخان تحت گرانش؛ پیکان پر سرعت توپ و پیکان توخالی سرعت دیواره در محل برخورد است.">
    <defs><marker id="hex-arrow-ball" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--viz-series-1)"/></marker><marker id="hex-arrow-wall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="var(--viz-series-2)" stroke-width="1.5"/></marker></defs>
    <g transform="scale(1,-1)">
      <circle cx="0" cy="0" r="1" fill="none" stroke="var(--border)" stroke-width="0.004" stroke-dasharray="0.018 0.025"/>
      <path d="M-.03 0H.03M0-.03V.03" fill="none" stroke="var(--muted-foreground)" stroke-width="0.005"/>
      <polygon id="hex-polygon" fill="var(--viz-series-2)" fill-opacity="0.045" stroke="var(--foreground)" stroke-width="0.012" stroke-linejoin="round"/>
      <circle id="hex-corner" r="0.023" fill="var(--foreground)"/>
      <path id="hex-trail" fill="none" stroke="var(--viz-series-1)" stroke-opacity="0.32" stroke-width="0.009" stroke-linecap="round"/>
      <line id="hex-wall-arrow" stroke="var(--viz-series-2)" stroke-width="0.009" marker-end="url(#hex-arrow-wall)"/>
      <circle id="hex-contact" r="0.02" fill="none" stroke="var(--viz-series-2)" stroke-width="0.006"/>
      <line id="hex-ball-arrow" stroke="var(--viz-series-1)" stroke-width="0.009" marker-end="url(#hex-arrow-ball)"/>
      <circle id="hex-ball" r="0.065" fill="var(--viz-series-1)"/>
      <circle id="hex-ball-center" r="0.009" fill="var(--background)"/>
    </g>
  </svg>
  <div class="viz-row text-small"><span>پیکان پر: سرعت توپ</span><span>پیکان توخالی: سرعت دیواره در آخرین برخورد</span></div>
  <div class="viz-row text-small" id="hex-metrics"><span>بیشترین نفوذ پیش از اصلاح: <output id="hex-penetration" class="tabular-nums" dir="ltr">0 mm</output></span><span>خطای تراز انرژی: <output id="hex-energy" class="tabular-nums" dir="ltr">0 J</output></span></div>
  <div class="text-small" id="hex-collision" dir="ltr">No collision yet</div>
  <div class="sr-only" id="hex-status" aria-live="polite"></div>
</div>
<style>
#hexlab-v1 {display:grid;gap:12px;color:var(--foreground);}
#hexlab-v1 #hex-view {display:block;width:100%;height:auto;max-height:490px;overflow:visible;}
#hexlab-v1 output {display:inline-block;}
#hexlab-v1 #hex-metrics {justify-content:space-between;}
#hexlab-v1 #hex-collision {overflow-wrap:anywhere;}
@media(max-width:440px){#hexlab-v1 #hex-view{max-height:350px;}#hexlab-v1 #hex-metrics{align-items:flex-start;}}
</style>
<script id="hex-physics-core">
(function(global){
'use strict';
const R=1, radius=.065, A=Math.sqrt(3)/2, EPS=1e-10;
function createSimulation(options={}) {
  const cfg=Object.assign({omega:.7,g:9.81,e:.85,step:1/480},options);
  const s={x:.08,y:.36,vx:.72,vy:.1,theta:.12,t:0,collisions:0,peakPen:0,wallWork:0,loss:0,last:null,fallbacks:0};
  const energy=()=>.5*(s.vx*s.vx+s.vy*s.vy)+cfg.g*s.y;
  s.E0=energy();
  let sleeping=false;
  let ax=0,ay=-cfg.g;
  function normal(i,theta=s.theta){const a=theta+(i+.5)*Math.PI/3;return {x:-Math.cos(a),y:-Math.sin(a)};}
  function gap(i,t=0){const n=normal(i,s.theta+cfg.omega*t);return n.x*(s.x+s.vx*t+.5*ax*t*t)+n.y*(s.y+s.vy*t+.5*ay*t*t)+A-radius;}
  function support(){
    ax=0;ay=-cfg.g;
    if(Math.abs(cfg.omega)>1e-12)return;
    // A stationary smooth wall supplies a normal reaction during sustained contact.
    for(let pass=0;pass<32;pass++){
      let changed=false;
      for(let i=0;i<6;i++){
        const n=normal(i),vn=s.vx*n.x+s.vy*n.y,an=ax*n.x+ay*n.y;
        if(gap(i)<2e-9&&Math.abs(vn)<1e-8&&an<0){ax-=an*n.x;ay-=an*n.y;changed=true;}
      }
      if(!changed)break;
    }
  }
  function drift(dt){s.x+=s.vx*dt+.5*ax*dt*dt;s.y+=s.vy*dt+.5*ay*dt*dt;s.vx+=ax*dt;s.vy+=ay*dt;s.theta+=cfg.omega*dt;s.t+=dt;}
  function impact(i,settle=false){
    const n=normal(i),qx=s.x-radius*n.x,qy=s.y-radius*n.y;
    const wx=-cfg.omega*qy,wy=cfg.omega*qx;
    const incoming=(s.vx-wx)*n.x+(s.vy-wy)*n.y;
    if(incoming>=-1e-11)return false;
    const effectiveE=settle?0:cfg.e;
    const j=-(1+effectiveE)*incoming;
    s.vx+=j*n.x;s.vy+=j*n.y;
    s.wallWork+=j*(wx*n.x+wy*n.y);
    s.loss+=.5*(1-effectiveE*effectiveE)*incoming*incoming;
    const outgoing=(s.vx-wx)*n.x+(s.vy-wy)*n.y;
    s.collisions++;
    s.last={i,qx,qy,wx,wy,nx:n.x,ny:n.y,incoming,outgoing,e:effectiveE,t:s.t};
    return true;
  }
  function project(){
    // Alternating projection handles both edge constraints near a vertex.
    for(let pass=0;pass<32;pass++){
      let worst=0;
      for(let i=0;i<6;i++){
        const d=gap(i),penetration=Math.max(0,-d);
        s.peakPen=Math.max(s.peakPen,penetration);worst=Math.max(worst,penetration);
        if(penetration>0){const n=normal(i);s.x+=(penetration+EPS)*n.x;s.y+=(penetration+EPS)*n.y;}
      }
      if(worst<1e-11)break;
    }
  }
  function advance(dt){
    if(sleeping){s.t+=dt;return;}
    let left=dt;
    while(left>1e-12){
      support();
      // Bound travel and angular change as well as elapsed time.
      const speed=Math.hypot(s.vx,s.vy)+Math.abs(cfg.omega)*(R+radius)+cfg.g*cfg.step;
      const h=Math.min(left,cfg.step,.025*radius/Math.max(speed,1e-6),.004/Math.max(Math.abs(cfg.omega),1e-6));
      let remain=h,events=0;
      while(remain>1e-12&&events<16){
        let hit=-1,hitT=remain+1;
        for(let i=0;i<6;i++){
          const start=gap(i),end=gap(i,remain);
          if(end>=-EPS)continue;
          let lo=0,hi=remain;
          if(start>EPS){
            for(let k=0;k<36;k++){const mid=(lo+hi)/2;if(gap(i,mid)>0)lo=mid;else hi=mid;}
          }else{
            const n=normal(i),rel=(s.vx+cfg.omega*s.y)*n.x+(s.vy-cfg.omega*s.x)*n.y;
            if(rel<-1e-8)hi=0;
            else {
              // Contact at rest: support forces are resolved at the substep end.
              continue;
            }
          }
          if(hi<hitT){hitT=hi;hit=i;}
        }
        if(hit<0){drift(remain);remain=0;break;}
        drift(hitT);remain-=hitT;
        impact(hit);project();support();events++;
      }
      if(remain>1e-12){s.fallbacks++;drift(remain);}
      project();
      // Low-speed persistent contact uses an inelastic support impulse.
      for(let pass=0;pass<4;pass++){
        let any=false;
        for(let i=0;i<6;i++)if(gap(i)<2e-9)any=impact(i,true)||any;
        if(!any)break;
      }
      left-=h;
      // Suppress the Zeno sequence at a stable, stationary bottom corner.
      if(cfg.omega===0&&cfg.g>0&&cfg.e<1&&Math.hypot(s.vx,s.vy)<.03){
        const rv=(A-radius)/A;
        const vv=Array.from({length:6},(_,i)=>({x:rv*Math.cos(s.theta+i*Math.PI/3),y:rv*Math.sin(s.theta+i*Math.PI/3)}));
        const bottom=vv.reduce((a,b)=>a.y<b.y?a:b);
        if(Math.hypot(s.x-bottom.x,s.y-bottom.y)<8e-5){
          s.loss+=.5*(s.vx*s.vx+s.vy*s.vy);s.vx=0;s.vy=0;
          s.x=bottom.x*(1-1e-10);s.y=bottom.y*(1-1e-10);
          sleeping=true;s.t+=left;left=0;
        }
      }
    }
  }
  function diagnostics(){return {energy:energy(),error:energy()-s.E0-s.wallWork+s.loss,minGap:Math.min(...Array.from({length:6},(_,i)=>gap(i))),...s};}
  function setState(values){sleeping=false;Object.assign(s,values);s.E0=energy();s.wallWork=0;s.loss=0;s.peakPen=0;s.collisions=0;s.last=null;s.fallbacks=0;}
  return {s,cfg,advance,diagnostics,setState,normal,gap,energy,R,radius};
}
global.createHexSimulation=createSimulation;
})(window);
</script>
<script>
(function(){
'use strict';
const root=document.getElementById('hexlab-v1');
const $=id=>root.querySelector('#'+id);
const omega=$('hex-omega'),gravity=$('hex-gravity'),bounce=$('hex-bounce');
let sim=window.createHexSimulation(),trail=[],accumulator=0,lastStamp=0,lastInfo=0;
let running=!window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const pause=$('hex-pause'),status=$('hex-status');
function params(){return {omega:Number(omega.value),g:Number(gravity.value),e:Number(bounce.value)};}
function syncLabels(){const p=params();$('hex-omega-out').textContent=p.omega.toFixed(2)+' rad/s';$('hex-gravity-out').textContent=p.g.toFixed(2)+' m/s²';$('hex-bounce-out').textContent=p.e.toFixed(2);}
function button(){pause.textContent=running?'توقف':'ادامه';pause.setAttribute('aria-pressed',String(running));}
function reset(){sim=window.createHexSimulation(params());trail=[];accumulator=0;lastInfo=0;syncLabels();draw();status.textContent='شبیه‌سازی از آغاز تنظیم شد.';}
[omega,gravity,bounce].forEach(el=>el.addEventListener('input',reset));
pause.addEventListener('click',()=>{running=!running;accumulator=0;button();status.textContent=running?'شبیه‌سازی در حال اجرا است.':'شبیه‌سازی متوقف شد.';});
$('hex-restart').addEventListener('click',reset);
function line(el,x,y,dx,dy){el.setAttribute('x1',x);el.setAttribute('y1',y);el.setAttribute('x2',x+dx);el.setAttribute('y2',y+dy);}
function draw(){
  const s=sim.s;
  const verts=Array.from({length:6},(_,i)=>{const a=s.theta+i*Math.PI/3;return [Math.cos(a),Math.sin(a)];});
  $('hex-polygon').setAttribute('points',verts.map(v=>v.join(',')).join(' '));
  $('hex-corner').setAttribute('cx',verts[0][0]);$('hex-corner').setAttribute('cy',verts[0][1]);
  for(const id of ['hex-ball','hex-ball-center']){$(id).setAttribute('cx',s.x);$(id).setAttribute('cy',s.y);}
  $('hex-trail').setAttribute('d',trail.map((p,i)=>(i?'L':'M')+p[0].toFixed(4)+','+p[1].toFixed(4)).join(' '));
  const v=Math.hypot(s.vx,s.vy),scale=Math.min(.06,.32/Math.max(v,1e-9));
  line($('hex-ball-arrow'),s.x,s.y,s.vx*scale,s.vy*scale);
  $('hex-ball-arrow').style.opacity=v>.03?'1':'0';
  const c=s.last,show=c&&s.t-c.t<.32;
  $('hex-wall-arrow').style.opacity=show?'1':'0';$('hex-contact').style.opacity=show?'1':'0';
  if(show){const w=Math.hypot(c.wx,c.wy),ws=Math.min(.16,.35/Math.max(w,1e-9));line($('hex-wall-arrow'),c.qx,c.qy,c.wx*ws,c.wy*ws);$('hex-contact').setAttribute('cx',c.qx);$('hex-contact').setAttribute('cy',c.qy);}
  if(s.t-lastInfo>.1||s.t===0){
    const d=sim.diagnostics();
    $('hex-time').textContent='t = '+s.t.toFixed(2)+' s';
    $('hex-penetration').textContent=(d.peakPen*1000).toExponential(2)+' mm';
    $('hex-energy').textContent=d.error.toExponential(2)+' J';
    $('hex-collision').textContent=c?'uₙ⁻ = '+c.incoming.toFixed(3)+' m/s  →  uₙ⁺ = '+c.outgoing.toFixed(3)+' m/s  |  e_eff = '+c.e.toFixed(2):'No collision yet';
    lastInfo=s.t;
  }
}
function frame(stamp){
  if(!root.isConnected)return;
  const elapsed=lastStamp?Math.min((stamp-lastStamp)/1000,.05):0;lastStamp=stamp;
  if(running&&!document.hidden){
    accumulator+=elapsed;
    while(accumulator>=1/120){sim.advance(1/120);accumulator-=1/120;trail.push([sim.s.x,sim.s.y]);if(trail.length>150)trail.shift();}
  }
  draw();requestAnimationFrame(frame);
}
button();syncLabels();draw();requestAnimationFrame(frame);
root.hexLab={get sim(){return sim;},reset,get running(){return running;}};
})();
</script>
