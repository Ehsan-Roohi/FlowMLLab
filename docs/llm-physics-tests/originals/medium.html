<div id="hex-medium" dir="rtl">
  <div class="viz-controls">
    <label class="form-label">چرخش <span id="hm-wv" class="tabular-nums">0.70 rad/s</span><input id="hm-w" class="form-range" type="range" min="-3" max="3" step="0.05" value="0.7"></label>
    <label class="form-label">گرانش <span id="hm-gv" class="tabular-nums">9.81 m/s²</span><input id="hm-g" class="form-range" type="range" min="0" max="20" step="0.01" value="9.81"></label>
    <label class="form-label">ضریب بازگشت <span id="hm-ev" class="tabular-nums">0.85</span><input id="hm-e" class="form-range" type="range" min="0" max="1" step="0.01" value="0.85"></label>
  </div>
  <div class="viz-row"><button id="hm-play" type="button" class="btn">توقف</button><button id="hm-reset" type="button" class="btn">شروع مجدد</button><span id="hm-time" class="tabular-nums">0.0 s</span><span class="text-small">شعاع شش‌ضلعی: ۱ متر · دیوارهٔ بدون اصطکاک</span></div>
  <svg id="hm-svg" viewBox="-1.2 -1.2 2.4 2.4" role="img" aria-label="توپ تحت گرانش در شش‌ضلعی چرخان">
    <g transform="scale(1,-1)">
      <polygon id="hm-poly" fill="none" stroke="var(--foreground)" stroke-width="0.012"></polygon>
      <polyline id="hm-trail" fill="none" stroke="var(--viz-series-1)" stroke-opacity="0.35" stroke-width="0.008"></polyline>
      <circle id="hm-corner" r="0.022" fill="var(--foreground)"></circle>
      <circle id="hm-ball" r="0.065" fill="var(--viz-series-1)"></circle>
    </g>
  </svg>
  <div class="viz-row text-small tabular-nums"><span>نفوذ فعلی: <span id="hm-penetration">0</span> mm</span><span>بیشترین نفوذ پیش از اصلاح: <span id="hm-max">0</span> mm</span><span>خطای قانون برخورد: <span id="hm-error">0</span> m/s</span></div>
  <div id="hm-last" class="text-small tabular-nums" dir="ltr">uₙ: — → — m/s</div>
  <span id="hm-status" class="sr-only" aria-live="polite"></span>
</div>
<style>
  #hex-medium {color:var(--foreground)}
  #hm-svg {display:block;width:100%;max-height:440px;margin:8px auto}
  #hex-medium .viz-row {margin-top:8px}
  #hm-last {margin-top:8px;text-align:center}
</style>
<script id="hm-core">
window.makeHexMedium = function(options={}) {
  const c=Object.assign({w:0.7,g:9.81,e:0.85},options);
  const s={x:0.08,y:0.36,vx:0.72,vy:0.1,t:0,maxPen:0,error:0,last:null,hits:0};
  const r=0.065,ap=Math.sqrt(3)/2;
  function face(i,t) {const a=0.12+c.w*t+(i+0.5)*Math.PI/3;return {x:Math.cos(a),y:Math.sin(a)};}
  function gap(i,dt=0) {const n=face(i,s.t+dt);return ap-r-n.x*(s.x+s.vx*dt)-n.y*(s.y+s.vy*dt-0.5*c.g*dt*dt);}
  function drift(dt) {s.x+=s.vx*dt;s.y+=s.vy*dt-0.5*c.g*dt*dt;s.vy-=c.g*dt;s.t+=dt;}
  function hit(i,e) {
    const n=face(i,s.t),qx=s.x+r*n.x,qy=s.y+r*n.y;
    const wx=-c.w*qy,wy=c.w*qx,un=(s.vx-wx)*n.x+(s.vy-wy)*n.y;
    if(un<=0)return;
    s.vx-=(1+e)*un*n.x;s.vy-=(1+e)*un*n.y;
    const after=(s.vx-wx)*n.x+(s.vy-wy)*n.y;
    s.error=Math.max(s.error,Math.abs(after+e*un));s.last={before:un,after,e};s.hits++;
  }
  function project() {
    for(let k=0;k<12;k++){
      let corrected=false;
      for(let i=0;i<6;i++) {const d=gap(i);s.maxPen=Math.max(s.maxPen,-d);if(d<0){const n=face(i,s.t);s.x+=n.x*(d-1e-12);s.y+=n.y*(d-1e-12);hit(i,0);corrected=true;}}
      if(!corrected)break;
    }
  }
  function substep(dt) {
    let left=dt;
    for(let events=0;events<10 && left>1e-12;events++){
      let at=left,which=-1;
      for(let i=0;i<6;i++)if(gap(i,left)<0){
        let lo=0,hi=left;
        if(gap(i)>0){for(let j=0;j<35;j++){const mid=(lo+hi)/2;if(gap(i,mid)>0)lo=mid;else hi=mid;}}
        else hi=0;
        if(hi<=at){at=hi;which=i;}
      }
      if(which<0){drift(left);left=0;break;}
      drift(at);left-=at;
      hit(which,c.e);
      const n=face(which,s.t);s.x-=n.x*1e-11;s.y-=n.y*1e-11;
    }
    if(left>0)drift(left);
    project();
  }
  function advance(dt) {
    while(dt>1e-12){const speed=Math.hypot(s.vx,s.vy)+Math.abs(c.w);const h=Math.min(dt,1/2400,0.001/Math.max(speed,1));substep(h);dt-=h;}
  }
  return {s,c,r,face,gap,hit,advance};
};
</script>
<script>
(()=>{
  const root=document.getElementById('hex-medium');
  const get=id=>root.querySelector('#hm-'+id);
  let sim,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,previous=null,trail=[],lastDisplay=0;
  function restart(){sim=window.makeHexMedium({w:+get('w').value,g:+get('g').value,e:+get('e').value});trail=[];previous=null;lastDisplay=-1;
    get('wv').textContent=sim.c.w.toFixed(2)+' rad/s';get('gv').textContent=sim.c.g.toFixed(2)+' m/s²';get('ev').textContent=sim.c.e.toFixed(2);draw();}
  function draw(){
    const s=sim.s,angle=.12+sim.c.w*s.t,points=[];
    for(let i=0;i<6;i++){const a=angle+i*Math.PI/3;points.push([Math.cos(a),Math.sin(a)]);}
    get('poly').setAttribute('points',points.map(p=>p.join(',')).join(' '));
    get('corner').setAttribute('cx',points[0][0]);get('corner').setAttribute('cy',points[0][1]);
    get('ball').setAttribute('cx',s.x);get('ball').setAttribute('cy',s.y);
    get('trail').setAttribute('points',trail.map(p=>p.join(',')).join(' '));
    if(s.t-lastDisplay>.1 || lastDisplay<0){lastDisplay=s.t;get('time').textContent=s.t.toFixed(1)+' s';
      get('penetration').textContent=(1000*Math.max(0,...Array.from({length:6},(_,i)=>-sim.gap(i)))).toFixed(6);
      get('max').textContent=(1000*s.maxPen).toFixed(6);get('error').textContent=s.error.toExponential(1);
      get('last').textContent=s.last?`uₙ: ${s.last.before.toFixed(3)} → ${s.last.after.toFixed(3)} m/s · e = ${s.last.e.toFixed(2)}`:'uₙ: — → — m/s';
    }
  }
  function updatePlay(){get('play').textContent=playing?'توقف':'ادامه';get('play').setAttribute('aria-pressed',String(playing));get('status').textContent=playing?'شبیه‌سازی در حال اجراست':'شبیه‌سازی متوقف است';}
  get('play').addEventListener('click',()=>{playing=!playing;previous=null;updatePlay();});
  get('reset').addEventListener('click',restart);
  ['w','g','e'].forEach(id=>get(id).addEventListener('input',restart));
  restart();updatePlay();
  function frame(now){if(!root.isConnected)return;if(playing&&previous!==null){sim.advance(Math.min((now-previous)/1000,.04));trail.push([sim.s.x,sim.s.y]);if(trail.length>120)trail.shift();draw();}previous=now;requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
})();
</script>
