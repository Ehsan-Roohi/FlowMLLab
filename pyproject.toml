[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowmllab"
version = "1.3.0"
description = "Reproducible CFD-to-scientific-machine-learning experiments"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Ehsan Roohi", email = "roohie@umass.edu" },
]
keywords = [
  "computational-fluid-dynamics",
  "scientific-machine-learning",
  "neural-operators",
  "lattice-boltzmann",
  "cylinder-wake",
  "gas-dynamics",
  "compressible-flow",
  "rarefied-flow",
  "deeponet",
  "DSMC",
  "uncertainty-quantification",
  "gaussian-processes",
  "reproducibility",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=2.0,<2.3",
  "pandas>=2.2,<2.4",
  "scipy>=1.13,<1.16",
  "matplotlib>=3.8,<3.11",
  "scikit-learn>=1.4,<1.7",
]

[project.optional-dependencies]
ml = [
  "tensorflow>=2.16,<2.22",
  "keras>=3.3,<3.16",
]
test = []
demo = [
  "streamlit==1.62.0",
]

[project.scripts]
flowmllab = "flowmllab.cli:main"

[project.urls]
Homepage = "https://github.com/Ehsan-Roohi/FlowMLLab"
Repository = "https://github.com/Ehsan-Roohi/FlowMLLab"
Documentation = "https://github.com/Ehsan-Roohi/FlowMLLab/blob/main/START_HERE.md"
Issues = "https://github.com/Ehsan-Roohi/FlowMLLab/issues"

[tool.setuptools.packages.find]
include = ["flowmllab*"]

[tool.setuptools.package-data]
flowmllab = ["assets/*.npz"]
